name: .NET Core

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Install dependencies
      run: dotnet restore src/ArrangeActAssert.sln
    - name: Build
      run: dotnet build --configuration Release --no-restore src/ArrangeActAssert.sln
    - name: Test
      run: dotnet test --no-restore --verbosity normal src/ArrangeActAssert.sln
      

